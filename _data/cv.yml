          - Developed and benchmarked deep learning approaches for enzyme function prediction using the ESM-2 protein language model
          - Implemented ESM-2 + Random Forest and ESM-2 + Multi-Layer Perceptron architectures to predict Enzyme Commission (EC) numbers
          - "Achieved the best performance with the MLP approach (Micro F1: 0.89, Macro F1: 0.77), improving over similarity-based methods"
          - Applied hyperparameter optimization and class imbalance handling to improve performance on rare enzyme classes

      - name: Deep Learning-based Neural Granger Causality for Solar Radiation Data
        start_date: 2025-03
        end_date: 2025-06
        highlights:
          - Addressed the limitations of traditional VAR models in capturing nonlinear dependencies in time series data
          - Implemented component-wise MLP (cMLP) and LSTM (cLSTM) models, assigning an independent network to each variable
          - Analyzed Granger causal relationships between solar radiation in Jeonju and key meteorological variables
          - Identified causality structures consistent with established relationships in solar meteorology

